# Server - Railway impose son propre port et gère le HTTPS en frontal
server.port=${PORT:8080}

# MySQL
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Redis
spring.data.redis.host=${REDISHOST}
spring.data.redis.port=${REDISPORT}
spring.data.redis.password=${REDISPASSWORD}

# Cache
spring.cache.type=redis

# Pas de server.ssl.* ici : Railway termine le HTTPS en frontal (reverse proxy),
# l'app Spring Boot tourne en HTTP en interne sur le réseau privé Railway
server.ssl.enabled=false